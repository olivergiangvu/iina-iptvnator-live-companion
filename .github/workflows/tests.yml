name: Tests
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript regression tests
        run: |
          node tests/test_plugin.cjs
          node tests/test_catchup.cjs
          node tests/test_archive_plugin.cjs
          node tests/test_latency.cjs
      - name: Package and verify IINA plugin
        run: |
          python3 scripts/package-plugin.py
          python3 - <<'PY'
          import json, pathlib, zipfile
          p=next(pathlib.Path('dist').glob('*0.1.3-beta.1.iinaplgz'))
          with zipfile.ZipFile(p) as z:
              assert set(z.namelist()) == {'Info.json','main.js'}
              assert json.loads(z.read('Info.json'))['version']=='0.1.3-beta.1'
          print('Plugin archive verified')
          PY
      - name: Paired launcher installer regression
        run: bash tests/test_launcher.sh
      - name: Protect unchanged VLC wrapper
        run: |
          echo '12d9be1a61f3aa8545de853df479c4c8d18979e2909b244f7248e1237550f623  companion/iptvnator-iina-vlc' | sha256sum -c

      - name: Package and verify Metadata Companion canary
        if: github.head_ref == 'fix/aiostreams-catchup-epg-provider-binding-20261115' || github.ref == 'refs/heads/fix/aiostreams-catchup-epg-provider-binding-20261115'
        run: |
          python3 scripts/package-companion.py
          python3 - <<'PY'
          import json, pathlib, tarfile
          p = next(pathlib.Path('dist').glob('IPTVnator-Metadata-Companion-0.1.3-beta.1.tar.gz'))
          with tarfile.open(p, 'r:gz') as archive:
              manifest = next(m for m in archive.getmembers() if m.name.endswith('/manifest.json'))
              assert json.load(archive.extractfile(manifest))['version'] == '0.1.3-beta.1'
          print('Metadata Companion canary verified')
          PY
      - name: Upload paired Catch-up canary packages
        if: github.head_ref == 'fix/aiostreams-catchup-epg-provider-binding-20261115' || github.ref == 'refs/heads/fix/aiostreams-catchup-epg-provider-binding-20261115'
        uses: actions/upload-artifact@v4
        with:
          name: IINA-IPTVnator-Catchup-Canary-v0.1.3-beta.1
          path: |
            dist/IPTVnator-Live-Companion-0.1.3-beta.1.iinaplgz
            dist/IPTVnator-Metadata-Companion-0.1.3-beta.1.tar.gz
          if-no-files-found: error
          retention-days: 14
